[package]
name = "axum-connect-example"
version = "0.3.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8.0"
axum-connect = { path = "../axum-connect" }
prost = "0.13.1"
tokio = { version = "1.43.0", features = ["full"] }
tower-http = { version = "0.5.2", features = ["cors"] }
futures = "0.3.31"
connect-core = { git = "https://github.com/connectrpc/connect-rust.git", rev = "b8e5159", features = ["axum"] }
async-stream = "0.3.5"

[build-dependencies]
axum-connect-build = { path = "../axum-connect-build" }
prost-build = "0.13.1"
